openapi: 3.1.0
info:
  title: SecureRAG API
  version: 0.1.0
  description: Tenant-isolated RAG retrieval with default-deny authorization
    enforced in SQL. Foreign and nonexistent resources are indistinguishable
    (same status and schema).
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-securerag_session
      description: OIDC session cookie (HttpOnly, Secure, SameSite=Lax).
        State-changing requests must also send the X-CSRF-Token header (from
        /auth/me).
  schemas: {}
paths:
  /auth/login:
    get:
      responses:
        "200":
          description: Default Response
  /auth/callback:
    get:
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 1000
          in: query
          name: code
          required: true
        - schema:
            type: string
            minLength: 1
            maxLength: 500
          in: query
          name: state
          required: true
        - schema:
            type: string
          in: query
          name: iss
          required: false
      responses:
        "200":
          description: Default Response
  /auth/logout:
    post:
      responses:
        "200":
          description: Default Response
  /auth/me:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    type: object
                    properties:
                      principalId:
                        type: string
                      provider:
                        type: string
                      externalSubject:
                        type: string
                      displayName:
                        type: string
                    required:
                      - principalId
                      - provider
                      - externalSubject
                      - displayName
                    additionalProperties: false
                  session:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      expiresAt:
                        type: string
                      csrfToken:
                        type: string
                    required:
                      - sessionId
                      - expiresAt
                      - csrfToken
                    additionalProperties: false
                  memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: string
                        membershipId:
                          type: string
                        role:
                          type: string
                      required:
                        - tenantId
                        - membershipId
                        - role
                      additionalProperties: false
                required:
                  - principal
                  - session
                  - memberships
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
                additionalProperties: false
  /memberships:
    get:
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: tenantId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: string
                        membershipId:
                          type: string
                        principalId:
                          type: string
                        role:
                          type: string
                        isActive:
                          type: boolean
                        joinedAt:
                          type: string
                      required:
