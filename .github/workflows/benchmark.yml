name: benchmark-fixture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-fixture:
    name: Envelope benchmark (fixture scale)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fixture-scale benchmark
        run: npm run benchmark
        env:
          BENCH_SCALE: ci
      - name: Report exists
        shell: bash
        run: |
          ls report/benchmark-*.json >/dev/null || { echo "no benchmark report produced"; exit 1; }
          echo "benchmark report produced:"
          ls report/benchmark-*.json
